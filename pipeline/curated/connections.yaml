# Curated connections — links Wikidata does not hold, or holds too thinly to explain.
# Each record: endpoints (English Wikipedia titles), kind, type, layer (relationship | claim | interpretation),
# explanation (readable), sources (URLs that support THIS link), uncertainty (competing views), status.
# Curated links are never auto-tiered; they are published only with status: accepted.

connections:
  - id: alexander2-banner-william
    from: "Pope Alexander II"
    to: "William the Conqueror"
    kind: claim
    type: sanctioned
    layer: claim
    time: {start: "1066"}
    explanation: >-
      According to William of Poitiers, Pope Alexander II sent William a papal banner before the 1066 invasion,
      signifying the pope's blessing of the campaign.
    sources:
      - "https://en.wikipedia.org/wiki/Pope_Alexander_II"
    uncertainty: >-
      The account comes from William of Poitiers, William's own chaplain and a partisan source; how explicitly the
      papacy endorsed the invasion is debated.
    status: accepted

